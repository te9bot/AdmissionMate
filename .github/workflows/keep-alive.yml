name: Keep backend awake

on:
  schedule:
    # Every 10 minutes - Render's free tier spins the service down after ~15
    # min of no requests, so this keeps it from ever going fully idle.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          check() {
            curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://admissionmate-api.onrender.com/health || echo "curl_failed"
          }

          status=$(check)
          echo "Health check returned HTTP $status"
          if [ "$status" != "200" ]; then
            echo "First check failed (got $status) - retrying once in case this is a cold start"
            sleep 20
            status=$(check)
            echo "Retry returned HTTP $status"
          fi

          if [ "$status" != "200" ]; then
            echo "::error::Health check failed twice (got $status) - service down or degraded (DB/Redis unreachable)"
            exit 1
          fi
