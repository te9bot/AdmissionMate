name: Keep backend awake

on:
  schedule:
    # Every 10 minutes - Render's free tier spins the service down after ~15
    # min of no requests, so this keeps it from ever going fully idle.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://admissionmate-api.onrender.com/health || echo "curl_failed")
          echo "Health check returned HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Health check did not return 200 (got $status) - the service may have been cold-starting"
          fi
